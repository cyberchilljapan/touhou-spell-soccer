<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>東方スペルサッカー Prototype</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
